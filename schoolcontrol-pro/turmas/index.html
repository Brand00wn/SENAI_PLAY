<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerenciar Turmas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>🏫 Gerenciamento de Turmas</h1>

    <section id="form-section">
      <h2>Cadastrar / Editar Turma</h2>
      <form id="turmaForm">
        <input type="hidden" id="id_turma" />
        <div>
          <label>Nome</label>
          <input id="nome" required />
        </div>
        <div>
          <label>Ano</label>
          <input id="ano" type="number" required min="2000" max="2100" />
        </div>
        <div>
          <label for="turno">Turno</label>
          <select id="turno" required>
            <option value="">Selecione...</option>
            <option value="Manhã">Manhã</option>
            <option value="Tarde">Tarde</option>
            <option value="Noite">Noite</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit">Salvar</button>
          <button type="button" id="btnReset">Limpar</button>
        </div>
      </form>
    </section>

    <section id="list-section">
      <h2>Lista de Turmas</h2>
      <table id="turmasTable">
        <thead>
          <tr><th>ID</th><th>Nome</th><th>Ano</th><th>Turno</th><th>Ações</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="turmas.js"></script>
</body>
</html>
