<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Matrículas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Matrículas</h1>

    <form id="formMatricula">
        <label>Aluno:</label>
        <select id="id_aluno_select"></select>

        <label>Turma:</label>
        <select id="id_turma_select"></select>

        <button type="submit">Matricular</button>
    </form>

    <h2>Lista de Matrículas</h2>
    <table id="tabelaMatriculas">
        <thead>
            <tr>
                <th>ID</th>
                <th>Aluno</th>
                <th>Turma</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="matriculas.js"></script>
</body>
</html>
