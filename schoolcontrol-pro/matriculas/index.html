<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrículas</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    form { margin-bottom: 20px; display: flex; flex-direction: column; width: 300px; gap: 6px; }
    button { cursor: pointer; padding: 6px 10px; }
  </style>
</head>
<body>
  <h1>Gerenciamento de Matrículas</h1>

  <h2>Nova Matrícula</h2>
  <form id="formMatricula">
    <label>Aluno</label>
    <select id="id_aluno_select" required></select>
    <label>Turma</label>
    <select id="id_turma_select" required></select>
    <label>Data</label>
    <input type="date" id="data_matricula">
    <button type="submit">Matricular</button>
  </form>

  <h2>Matrículas Existentes</h2>
  <table id="tabelaMatriculas">
    <thead>
      <tr><th>Aluno</th><th>Turma</th><th>Data</th><th>Ações</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="matriculas.js"></script>
</body>
</html>
